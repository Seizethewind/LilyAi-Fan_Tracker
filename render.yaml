services:
  - type: web
    name: lilyai-fan-tracker
    runtime: node
    plan: free
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_GUILD_ID
        sync: false
      - key: UMAMOE_API_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: API_READ_KEY
        sync: false
      - key: API_WRITE_KEY
        sync: false
      - key: AI_ROUTER_URL
        sync: false
      - key: AI_ROUTER_API_KEY
        sync: false
      - key: AI_MODEL
        value: auto
      - key: AI_USER_COOLDOWN_SECONDS
        value: "10"
      - key: CORS_ORIGINS
        sync: false
      - key: CLUB1_ID
        value: "974470619"
      - key: CLUB1_LABEL
        value: Club 1
      - key: CLUB2_ID
        value: "325938032"
      - key: CLUB2_LABEL
        value: Club 2
      - key: SYNC_INTERVAL_SECONDS
        value: "300"
      - key: SELF_PING_INTERVAL_SECONDS
        value: "300"
